<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />

  <!-- meta情報 -->
  <title>三木歯科・小児歯科｜川越市の歯を“守る”歯医者【駐車場・バリアフリー完備】</title>
  <meta name="description" content="川越市の三木歯科・小児歯科です。日本小児歯科学会認定の小児歯科専門医が在籍し、大人と子どもで待合室・診療室を分けた院内環境をご用意。1986年開業、親子二代の連携で幅広い年代の治療に対応します。" />

  <!-- ogp -->
  <meta property="og:title" content="" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="" />
  <meta property="og:site_name" content="" />
  <meta property="og:description" content="" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- ファビコン -->
  <link rel="icon" href="/assets/img/favicon.ico" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;700&display=swap"
    rel="stylesheet" />

  <!-- css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="/assets/css/style.css" />

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
  <script src="/assets/js/script.js" defer></script>
</head>

<body>

  @@include('./parts/header.html', { "isTop": true })
  @@include('./parts/fixed-nav.html')

  <main class="main">

    <!-- ========================================
      FV
    ======================================== -->
    <div class="top-fv">
      <div class="top-fv__bg" aria-hidden="true">
        <span class="top-fv__watermark"></span>
      </div>

      <ul class="badge-list top-fv__badges">
        <li class="badge">駐車場完備</li>
        <li class="badge">バリアフリー</li>
        <li class="badge">保育スペース有</li>
        <li class="badge">車イス有</li>
      </ul>

      <div class="top-fv__body">
        <p class="top-fv__catch">
          <span class="top-fv__catch-line">歯を“治す”のではなく、</span><span class="top-fv__catch-line">歯を“守る”歯医者</span>
        </p>
        <p class="top-fv__lead">
          <span class="top-fv__lead-line">大人も子どもも安心して通える、</span><span class="top-fv__lead-line">それぞれに最適な環境とやさしい治療を</span>
        </p>
      </div>

      <div class="top-fv__slider swiper js-fv-slider">
        <div class="swiper-wrapper">
          <div class="swiper-slide top-fv__slide">
            <picture class="pic">
              <source srcset="/assets/img/fv/fv-01.webp" type="image/webp" />
              <img src="/assets/img/fv/fv-01.jpg" alt="患者様を診療する歯科医師" class="top-fv__img top-fv__img--01" width="1024" height="683" fetchpriority="high" />
            </picture>
          </div>
          <div class="swiper-slide top-fv__slide">
            <picture class="pic">
              <source srcset="/assets/img/fv/fv-02.webp" type="image/webp" />
              <img src="/assets/img/fv/fv-02.jpg" alt="受付カウンターと待合スペース" class="top-fv__img top-fv__img--02" width="1024" height="683" />
            </picture>
          </div>
          <div class="swiper-slide top-fv__slide">
            <picture class="pic">
              <source srcset="/assets/img/fv/fv-03.webp" type="image/webp" />
              <img src="/assets/img/fv/fv-03.jpg" alt="歯の模型を使って説明する歯科医師" class="top-fv__img top-fv__img--03" width="1024" height="683" />
            </picture>
          </div>
          <div class="swiper-slide top-fv__slide">
            <picture class="pic">
              <source srcset="/assets/img/fv/fv-04.webp" type="image/webp" />
              <img src="/assets/img/fv/fv-04.jpg" alt="動物の壁画とバランスボールがある小児用スペース" class="top-fv__img top-fv__img--04" width="1024" height="683" />
            </picture>
          </div>
          <div class="swiper-slide top-fv__slide">
            <picture class="pic">
              <source srcset="/assets/img/fv/fv-05.webp" type="image/webp" />
              <img src="/assets/img/fv/fv-05.jpg" alt="歯の模型を持って説明する歯科衛生士" class="top-fv__img top-fv__img--05" width="1024" height="683" />
            </picture>
          </div>
        </div>
      </div>
    </div>

  </main>

  @@include('./parts/footer.html')

</body>
</html>
